# --- Terminal capabilities ---
# Truecolor. `-u` resets to tmux's defaults first, so re-sourcing this file is
# idempotent; a bare `set -ga` appends another copy every reload (the live
# server had accumulated seven). These were runtime-only until now, meaning a
# tmux server restart would have silently dropped 24-bit colour.
set -g default-terminal "tmux-256color"
set -gu terminal-features
set -ga terminal-features "*:RGB"

unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"  
bind -n WheelDownPane select-pane -t= \; send-keys -M 

unbind n
bind n if-shell "tmux select-window -t code" "" "new-window; rename-window 'code'; send-keys 'vim' Enter"
unbind g
bind g if-shell "tmux select-window -t git" "" "new-window; rename-window 'git'; send-keys 'lazygit' Enter"
unbind s
bind s if-shell "tmux select-window -t sql" "" "new-window; rename-window 'sql'; send-keys 'nvim +DBUI' Enter"
unbind d
bind d if-shell "tmux select-window -t docker" "" "new-window; rename-window 'docker'; send-keys 'lazydocker' Enter"

unbind q
bind q if-shell "tmux select-window -t shell" "" "new-window; rename-window 'shell';"
unbind a
bind a if-shell "tmux select-window -t claude" "" "new-window -n claude; send-keys 'claude' Enter"
unbind A
bind A if-shell "tmux select-window -t omp" "" "new-window -n omp; send-keys 'omp' Enter"

unbind w
# Show windows in current session
bind w run-shell 'tmux choose-tree -Nwf"##{==:##{session_name},#{session_name}}"'
bind W run-shell 'tmux choose-tree -w'

unbind k
bind k kill-pane -a -t :
unbind K
bind K kill-window -a -t :

unbind P
bind P choose-tree -s

unbind p
bind-key "p" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
)\""

set -g base-index 1
setw -g pane-base-index 1

set -s escape-time 0

# Extended keys (CSI-u): lets TUIs like Claude Code distinguish Shift+Enter,
# Ctrl+Enter, etc. from plain Enter.
set -g extended-keys on
set -g extended-keys-format csi-u

set-option -g renumber-windows on

# Killing the last window destroys the session. Default (`on`) then detaches the
# client, dumping you out of tmux entirely. `off` switches you to another live
# session instead, so you only ever land in a bare shell if this was the last
# session on the server.
set -g detach-on-destroy off
setw -g mouse on

# Send copied text to the local (macOS) clipboard via OSC 52, so tmux copies
# cross ssh. Needs an OSC52-capable terminal (iTerm2/kitty/WezTerm/Ghostty).
set -g set-clipboard on

set-option -g repeat-time 1000

bind -r Left previous-window
bind -r Right next-window
bind -r Up switch-client -p
bind -r Down switch-client -n
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind tab last-window 

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

set-window-option -g mode-keys vi

set -g status-left ""
set -g status-right ""
setw -g status-left ""

setw -g status-left-style fg=colour240,bg=default
setw -g status-style fg=colour240,bg=default

setw -g status-right ""
setw -g status-right-style fg=colour220,bg=default

setw -g window-status-current-format ""
setw -g window-status-current-style fg=colour111,bg=default

setw -g window-status-format ""
setw -g window-status-style fg=colour240,bg=default

set -g pane-border-style fg=colour233,bg=default
set -g pane-active-border-style fg=colour235,bg=colour235

# Session persistence across reboots: resurrect saves layout + pane cwd,
# continuum auto-saves every 15 min and auto-restores on server start.
# Save now: prefix+Ctrl-s   Restore: prefix+Ctrl-r
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# After resurrect finishes, its panes are back but every agent is a bare shell.
# post-restore-all fires once the whole restore is done, which is the moment
# every pane exists, so resume the agents into them from here.
# @restore-agents-on-reboot gates it and defaults to on; set it 'off' and reload
# to stop the resume without touching persistence. The command comes from the
# fleet's deployed path so the wiring holds wherever this repo is checked out.
set -g @restore-agents-on-reboot 'on'
set -g @resurrect-hook-post-restore-all 'if [ "$(tmux show-option -gqv @restore-agents-on-reboot)" = on ]; then mkdir -p ~/.local/state; { date; ~/.shyrosa/scripts/restore-agents.py; echo; } >> ~/.local/state/restore-agents.log 2>&1; fi'
run '~/.config/tmux/plugins/tpm/tpm'

